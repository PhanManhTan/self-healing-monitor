rules:
- name: Monitor CPU
  type: cpu
  thresholds:
  - 70
  - 85
  - 95
  cooldown: 60
  interval: 10
- name: Monitor RAM
  type: memory
  thresholds:
  - 70
  - 85
  - 95
  cooldown: 60
  interval: 10
- name: Monitor Disk
  type: disk
  mount_path: /
  thresholds:
  - 80
  - 90
  - 95
  cooldown: 300
  interval: 60
- name: Monitor Processes
  type: process_auto
  cpu_threshold: 80
  ram_threshold: 80
  cooldown: 30
  interval: 10
- name: Monitor containerd
  type: service
  service_name: containerd
  if_status: inactive
  action: systemctl restart containerd
  cooldown: 60
  interval: 10
- name: Monitor cron
  type: service
  service_name: cron
  if_status: inactive
  action: systemctl restart cron
  cooldown: 60
  interval: 10
- name: Monitor docker
  type: service
  service_name: docker
  if_status: inactive
  action: systemctl restart docker
  cooldown: 60
  interval: 10
- name: Monitor rsyslog
  type: service
  service_name: rsyslog
  if_status: inactive
  action: systemctl restart rsyslog
  cooldown: 60
  interval: 10
- name: Monitor snapd
  type: service
  service_name: snapd
  if_status: inactive
  action: systemctl restart snapd
  cooldown: 60
  interval: 10
